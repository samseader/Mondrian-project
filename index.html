<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .container {
      display: grid;
      gap: 9px;
      height: 748px;
      width: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      background-color: #000
    }

    .red  {
      background-color: #E72F24;
      grid-area: 1 / 1 / 2 / 2;
    }

    .top-gray {
      background-color: #F0F1EC;
      grid-column: 2 / 5;
      grid-row: 1 / 2;
    }

    .mid-left-gray {
      background-color: #F0F1EC;
      grid-area: 2 / 1 / 4 / 2;
    }

    .mid-gray {
      background-color: #F0F1EC;
      grid-area: 2 / 2 / 4 / 4;    
    }

    .blue {
      background-color: #004592;
      grid-column: 4 / 5;
      grid-row: 2 / 3;
      border-bottom: 10px black solid;
    }

    .bottom-left-gray {
      background-color: #F0F1EC;
      grid-area:  4 / 1 / 5 / 2;      
    }

    .yellow {
      background-color: #F9D01E;
      grid-area: 4 / 2 / 5 / 3;
    }

    .black {
      background-color: #232629;
      grid-area: 4 / 3 / 5 / 4;
    }

    .bottom-right-gray {
      background-color: #F0F1EC;
      grid-area: 3 / 4 / 5 / 5;
    }
  
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
      <div class="red"></div>
      <div class="top-gray"></div>
      <div class="mid-left-gray"></div>
      <div class="mid-gray"></div>
      <div class="blue"></div>
      <div class="bottom-left-gray"></div>
      <div class="yellow"></div>
      <div class="black"></div>
      <div class="bottom-right-gray"></div>
   </div>
</body>

</html>
